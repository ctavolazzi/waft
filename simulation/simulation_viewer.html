<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoth Realm Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 10px;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        h1 {
            color: #00ffff;
            margin-bottom: 15px;
            text-align: center;
            font-size: clamp(1.2em, 4vw, 2em);
            word-wrap: break-word;
        }
        
        .controls {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        
        .controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        
        .controls input, .controls button, .controls select {
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            min-width: 60px;
        }
        
        .controls input[type="number"] {
            width: 70px;
        }
        
        .controls button {
            flex: 1 1 auto;
            min-width: 120px;
        }
        
        .controls button {
            cursor: pointer;
        }
        
        .controls button:hover {
            background: #00ff00;
            color: #000;
        }
        
        .status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .status-box {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            flex: 1;
            border-radius: 5px;
        }
        
        .status-box h3 {
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .metric {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 8px;
            border-radius: 5px;
        }
        
        .metric-label {
            color: #888;
            font-size: 0.85em;
            word-wrap: break-word;
        }
        
        .metric-value {
            color: #00ffff;
            font-size: clamp(1.2em, 3vw, 1.5em);
            font-weight: bold;
        }
        
        .realms {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .realm {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            border-radius: 5px;
        }
        
        .realm h3 {
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        .realm-info {
            margin: 10px 0;
            font-size: 0.9em;
        }
        
        .events {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 5px;
            margin-bottom: 80px; /* Space for Console Goblin on mobile */
        }
        
        .events h3 {
            color: #00ffff;
            margin-bottom: 8px;
            font-size: clamp(0.9em, 2.5vw, 1.1em);
        }
        
        .event {
            padding: 4px;
            margin: 4px 0;
            border-left: 3px solid #00ff00;
            padding-left: 8px;
            font-size: 0.8em;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .event.error {
            border-left: 3px solid #ff0000;
        }
        
        /* Console Goblin Styles */
        .console-goblin {
            position: fixed;
            bottom: 10px;
            right: 10px;
            left: 10px;
            width: auto;
            max-width: 400px;
            max-height: 40vh;
            background: #1a1a1a;
            border: 2px solid #ff8800;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
        }
        
        .console-goblin.minimized {
            height: auto;
            max-height: 50px;
            width: auto;
            min-width: 200px;
        }
        
        .console-goblin-header {
            background: #2a1a0a;
            border-bottom: 2px solid #ff8800;
            padding: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ff8800;
            flex-shrink: 0;
        }
        
        .console-goblin-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 0.9em;
            flex: 1;
            min-width: 0;
        }
        
        .console-goblin-title span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .console-goblin-icon {
            font-size: 1.3em;
            flex-shrink: 0;
        }
        
        .console-goblin-toggle {
            background: none;
            border: 1px solid #ff8800;
            color: #ff8800;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.8em;
            flex-shrink: 0;
        }
        
        .console-goblin-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            max-height: calc(40vh - 100px);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }
        
        .console-goblin.minimized .console-goblin-body {
            display: none;
        }
        
        .console-goblin-entry {
            padding: 4px;
            border-left: 3px solid #666;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            word-wrap: break-word;
            line-height: 1.3;
            overflow-wrap: break-word;
        }
        
        .console-goblin-entry.log {
            border-left-color: #00ff00;
            color: #00ff00;
        }
        
        .console-goblin-entry.error {
            border-left-color: #ff0000;
            color: #ff6600;
            background: #1a0a0a;
        }
        
        .console-goblin-entry.warn {
            border-left-color: #ffaa00;
            color: #ffaa00;
        }
        
        .console-goblin-entry.info {
            border-left-color: #00aaff;
            color: #00aaff;
        }
        
        .console-goblin-timestamp {
            color: #666;
            font-size: 0.8em;
            margin-right: 5px;
        }
        
        .console-goblin-buttons {
            display: flex;
            flex-direction: row;
            gap: 5px;
            padding: 5px;
            flex-shrink: 0;
        }
        
        .console-goblin-clear,
        .console-goblin-copy {
            background: #ff8800;
            color: #000;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            flex: 1;
            border-radius: 3px;
        }
        
        .console-goblin-clear:hover,
        .console-goblin-copy:hover {
            background: #ffaa00;
        }
        
        .console-goblin-copy.copied {
            background: #00ff00;
            color: #000;
        }
        
        /* Realm Browser Modal */
        .realm-browser-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .realm-browser-content {
            background: #1a1a1a;
            border: 2px solid #00ffff;
            border-radius: 10px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        .realm-browser-header {
            background: #2a1a1a;
            border-bottom: 2px solid #00ffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .realm-browser-header h2 {
            color: #00ffff;
            margin: 0;
            font-size: 1.5em;
        }
        
        .realm-browser-close {
            background: #ff0000;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            line-height: 1;
            padding: 0;
        }
        
        .realm-browser-close:hover {
            background: #ff4444;
        }
        
        .realm-browser-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        
        .realm-browser-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .realm-browser-actions button {
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        .realm-browser-actions button:hover {
            background: #00ff00;
            color: #000;
        }
        
        .realm-browser-list {
            display: grid;
            gap: 15px;
        }
        
        .realm-browser-item {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .realm-browser-item:hover {
            border-color: #00ffff;
            background: #1a1a1a;
            transform: translateX(5px);
        }
        
        .realm-browser-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .realm-browser-item-id {
            color: #00ffff;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .realm-browser-item-state {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .realm-browser-item-state.running {
            background: #00ff00;
            color: #000;
        }
        
        .realm-browser-item-state.paused {
            background: #ffaa00;
            color: #000;
        }
        
        .realm-browser-item-state.completed {
            background: #00aaff;
            color: #fff;
        }
        
        .realm-browser-item-state.initializing {
            background: #888;
            color: #fff;
        }
        
        .realm-browser-item-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }
        
        .realm-browser-item-info div {
            color: #888;
        }
        
        .realm-browser-item-info strong {
            color: #00ff00;
        }
        
        .realm-browser-item-directives {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        
        .realm-browser-item-directives div {
            color: #00aaff;
            font-size: 0.85em;
            margin: 3px 0;
        }
        
        .realm-browser-loading {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        
        .realm-browser-empty {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            
            h1 {
                margin-bottom: 10px;
                font-size: 1.3em;
            }
            
            .controls {
                padding: 12px;
                margin-bottom: 12px;
                flex-direction: column;
                align-items: stretch;
            }
            
            .controls label {
                width: 100%;
                justify-content: space-between;
            }
            
            .controls input[type="number"] {
                width: 80px;
            }
            
            .controls button {
                width: 100%;
                margin: 2px 0;
            }
            
            .status {
                gap: 10px;
                margin-bottom: 12px;
            }
            
            .status-box {
                flex: 1 1 100%;
                padding: 10px;
            }
            
            .metrics {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                margin-bottom: 12px;
            }
            
            .metric {
                padding: 6px;
            }
            
            .metric-label {
                font-size: 0.75em;
            }
            
            .metric-value {
                font-size: 1.2em;
            }
            
            .realms {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 12px;
            }
            
            .realm {
                padding: 10px;
            }
            
            .events {
                padding: 10px;
                max-height: 250px;
                margin-bottom: 70px;
            }
            
            .event {
                font-size: 0.75em;
                padding: 3px;
                padding-left: 6px;
            }
            
            /* Console Goblin Mobile */
            .console-goblin {
                bottom: 5px;
                right: 5px;
                left: 5px;
                max-width: none;
                max-height: 35vh;
                font-size: 0.75em;
            }
            
            .console-goblin.minimized {
                width: auto;
                min-width: 150px;
            }
            
            .console-goblin-header {
                padding: 6px;
            }
            
            .console-goblin-title {
                font-size: 0.85em;
                gap: 6px;
            }
            
            .console-goblin-icon {
                font-size: 1.2em;
            }
            
            .console-goblin-body {
                padding: 6px;
                max-height: calc(35vh - 90px);
                gap: 3px;
            }
            
            .console-goblin-entry {
                font-size: 0.75em;
                padding: 3px;
            }
            
            .console-goblin-clear,
            .console-goblin-copy {
                padding: 5px 10px;
                font-size: 0.8em;
            }
            
            .console-goblin-buttons {
                flex-direction: row;
            }
            
            .realm-browser-content {
                max-height: 95vh;
            }
            
            .realm-browser-body {
                padding: 15px;
            }
            
            .realm-browser-item-info {
                grid-template-columns: 1fr;
            }
            
            .pantheon-link {
                position: relative;
                display: block;
                margin-bottom: 10px;
                text-align: center;
            }
            
            h1 {
                margin-top: 10px;
            }
        }
        
        @media (min-width: 769px) and (max-width: 1024px) {
            .console-goblin {
                max-width: 350px;
                max-height: 45vh;
            }
            
            .realms {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
            
            .events {
                max-height: 350px;
            }
        }
        
        @media (min-width: 1025px) {
            .console-goblin {
                right: 20px;
                left: auto;
            }
        }
        
        /* Landscape mobile optimization */
        @media (max-width: 768px) and (orientation: landscape) {
            .events {
                max-height: 200px;
            }
            
            .console-goblin {
                max-height: 30vh;
            }
            
            .console-goblin-body {
                max-height: calc(30vh - 90px);
            }
        }
        
        .event.realm_created {
            border-color: #00ffff;
        }
        
        .event.being_spawned {
            border-color: #ffff00;
        }
        
        .event.tool_granted {
            border-color: #ff00ff;
        }
        
        .event.tool_evolved {
            border-color: #ff8800;
        }
        
        .event.tool_became_aware {
            border-color: #ff0000;
            animation: pulse 1s infinite;
        }
        
        .event.tool_woke_up {
            border-color: #00ff88;
        }
        
        .event.realm_awareness_increased {
            border-color: #8800ff;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .timestamp {
            color: #888;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="/pantheon" class="pantheon-link">← Go back to the Pantheon</a>
            <h1>⚔️ THOTH REALM SIMULATOR ⚔️</h1>
        </div>
        
        <div class="controls">
            <label>Realms:</label>
            <input type="number" id="numRealms" value="1" min="1" max="10">
            
            <label>Batch Size:</label>
            <input type="number" id="batchSize" value="1" min="1" max="1000">
            
            <button onclick="showRealmBrowser()">📚 Realm Browser</button>
            <button onclick="createSimulation()">Create Simulation</button>
            <button onclick="startSimulation()">Start</button>
            <button onclick="pauseSimulation()">Pause</button>
            <button onclick="resumeSimulation()">Resume</button>
            
            <span id="simulationId" style="margin-left: 20px; color: #888;"></span>
        </div>
        
        <!-- Realm Browser Modal -->
        <div id="realmBrowser" class="realm-browser-modal" style="display: none;">
            <div class="realm-browser-content">
                <div class="realm-browser-header">
                    <h2>📚 Realm Browser</h2>
                    <button class="realm-browser-close" onclick="hideRealmBrowser()">×</button>
                </div>
                <div class="realm-browser-body">
                    <div class="realm-browser-actions">
                        <button onclick="refreshRealmBrowser()">🔄 Refresh</button>
                        <button onclick="createNewSimulation()">✨ New Simulation</button>
                    </div>
                    <div id="realmBrowserList" class="realm-browser-list">
                        <div class="realm-browser-loading">Loading simulations...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status" id="status">
            <div class="status-box">
                <h3>Status</h3>
                <div id="statusText">Not Started</div>
            </div>
            <div class="status-box">
                <h3>Cycle</h3>
                <div id="cycleText">0</div>
            </div>
        </div>
        
        <div class="metrics" id="metrics">
            <!-- Metrics will be populated here -->
        </div>
        
        <div class="realms" id="realms">
            <!-- Realms will be populated here -->
        </div>
        
        <div class="events">
            <h3>Events</h3>
            <div id="eventsList"></div>
        </div>
    </div>
    
    <!-- Console Goblin - Bug Hunter Demi-God -->
    <div class="console-goblin" id="consoleGoblin">
        <div class="console-goblin-header" onclick="toggleConsoleGoblin()">
            <div class="console-goblin-title">
                <span class="console-goblin-icon">🐛</span>
                <span>Console Goblin - Bug Hunter</span>
            </div>
            <button class="console-goblin-toggle" onclick="event.stopPropagation(); toggleConsoleGoblin()">
                <span id="goblinToggle">−</span>
            </button>
        </div>
        <div class="console-goblin-body" id="goblinBody">
            <div class="console-goblin-entry info">
                <span class="console-goblin-timestamp">[SPAWNED]</span>
                <strong>Console Goblin activated!</strong> I'm watching for bugs... 👀
            </div>
        </div>
        <div class="console-goblin-buttons">
            <button class="console-goblin-copy" onclick="copyConsoleLogs()" id="copyLogsBtn">Copy Logs</button>
            <button class="console-goblin-clear" onclick="clearConsoleGoblin()">Clear Logs</button>
        </div>
    </div>
    
    <script>
        // Console Goblin - Intercept console methods
        (function() {
            const goblinBody = document.getElementById('goblinBody');
            const maxEntries = 100;
            let entryCount = 0;
            
            function addGoblinEntry(type, args) {
                entryCount++;
                const timestamp = new Date().toLocaleTimeString();
                const message = args.map(arg => {
                    if (typeof arg === 'object') {
                        try {
                            return JSON.stringify(arg, null, 2);
                        } catch (e) {
                            return String(arg);
                        }
                    }
                    return String(arg);
                }).join(' ');
                
                const entry = document.createElement('div');
                entry.className = `console-goblin-entry ${type}`;
                entry.innerHTML = `<span class="console-goblin-timestamp">[${timestamp}]</span>${message}`;
                
                goblinBody.appendChild(entry);
                
                // Keep only last maxEntries
                while (goblinBody.children.length > maxEntries) {
                    goblinBody.removeChild(goblinBody.firstChild);
                }
                
                // Auto-scroll to bottom
                goblinBody.scrollTop = goblinBody.scrollHeight;
                
                // Show goblin if minimized and error occurs
                if (type === 'error' && document.getElementById('consoleGoblin').classList.contains('minimized')) {
                    toggleConsoleGoblin();
                }
            }
            
            // Store original console methods
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            const originalInfo = console.info;
            
            // Override console methods
            console.log = function(...args) {
                originalLog.apply(console, args);
                addGoblinEntry('log', args);
            };
            
            console.error = function(...args) {
                originalError.apply(console, args);
                addGoblinEntry('error', args);
            };
            
            console.warn = function(...args) {
                originalWarn.apply(console, args);
                addGoblinEntry('warn', args);
            };
            
            console.info = function(...args) {
                originalInfo.apply(console, args);
                addGoblinEntry('info', args);
            };
            
            // Catch unhandled errors
            window.addEventListener('error', function(event) {
                addGoblinEntry('error', [
                    `Uncaught Error: ${event.message}`,
                    `at ${event.filename}:${event.lineno}:${event.colno}`
                ]);
            });
            
            // Catch unhandled promise rejections
            window.addEventListener('unhandledrejection', function(event) {
                addGoblinEntry('error', [
                    `Unhandled Promise Rejection:`,
                    event.reason
                ]);
            });
        })();
        
        function toggleConsoleGoblin() {
            const goblin = document.getElementById('consoleGoblin');
            const toggle = document.getElementById('goblinToggle');
            goblin.classList.toggle('minimized');
            toggle.textContent = goblin.classList.contains('minimized') ? '+' : '−';
        }
        
        function clearConsoleGoblin() {
            const goblinBody = document.getElementById('goblinBody');
            goblinBody.innerHTML = '<div class="console-goblin-entry info"><span class="console-goblin-timestamp">[CLEARED]</span>Console cleared by Console Goblin 🧹</div>';
        }
        
        function copyConsoleLogs() {
            const goblinBody = document.getElementById('goblinBody');
            const entries = Array.from(goblinBody.children).map(entry => {
                return entry.textContent || entry.innerText;
            }).join('\n');
            
            if (entries.trim() === '') {
                console.log('No logs to copy');
                return;
            }
            
            navigator.clipboard.writeText(entries).then(() => {
                const btn = document.getElementById('copyLogsBtn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied! ✓';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
                console.log('Logs copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy logs:', err);
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = entries;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    const btn = document.getElementById('copyLogsBtn');
                    btn.textContent = 'Copied! ✓';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = 'Copy Logs';
                        btn.classList.remove('copied');
                    }, 2000);
                } catch (e) {
                    console.error('Fallback copy failed:', e);
                }
                document.body.removeChild(textarea);
            });
        }
        
        // Auto-refresh on file changes
        (function() {
            let refreshWebSocket = null;
            let reconnectTimeout = null;
            
            function connectRefreshWebSocket() {
                try {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws/refresh`;
                    console.log('🔄 Connecting to auto-refresh WebSocket:', wsUrl);
                    refreshWebSocket = new WebSocket(wsUrl);
                    
                    refreshWebSocket.onopen = function() {
                        console.log('✅ Auto-refresh WebSocket connected! Page will refresh when files change.');
                    };
                    
                    refreshWebSocket.onmessage = function(event) {
                        const message = JSON.parse(event.data);
                        if (message.type === 'refresh') {
                            console.log('🔄 File changed, refreshing page...', message.message);
                            window.location.reload();
                        }
                    };
                    
                    refreshWebSocket.onerror = function(error) {
                        console.log('⚠️ Refresh WebSocket error (will retry):', error);
                    };
                    
                    refreshWebSocket.onclose = function() {
                        console.log('🔄 Refresh WebSocket closed, reconnecting in 2 seconds...');
                        // Reconnect after 2 seconds
                        reconnectTimeout = setTimeout(connectRefreshWebSocket, 2000);
                    };
                } catch (e) {
                    console.error('❌ Failed to connect refresh WebSocket:', e);
                    // Retry after 5 seconds
                    reconnectTimeout = setTimeout(connectRefreshWebSocket, 5000);
                }
            }
            
            // Connect on page load
            connectRefreshWebSocket();
            
            // Cleanup on page unload
            window.addEventListener('beforeunload', function() {
                if (refreshWebSocket) {
                    refreshWebSocket.close();
                }
                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                }
            });
        })();
    </script>
    
    <script>
        let simulationId = null;
        let ws = null;
        
        let realmBrowserOpen = false;
        
        async function showRealmBrowser() {
            realmBrowserOpen = true;
            document.getElementById('realmBrowser').style.display = 'flex';
            await refreshRealmBrowser();
        }
        
        function hideRealmBrowser() {
            realmBrowserOpen = false;
            document.getElementById('realmBrowser').style.display = 'none';
        }
        
        async function refreshRealmBrowser() {
            const listDiv = document.getElementById('realmBrowserList');
            listDiv.innerHTML = '<div class="realm-browser-loading">Loading simulations...</div>';
            
            try {
                const response = await fetch('/api/simulations/list');
                const data = await response.json();
                const simulations = data.simulations || [];
                
                if (simulations.length === 0) {
                    listDiv.innerHTML = '<div class="realm-browser-empty">No simulations found. Create one to get started!</div>';
                    return;
                }
                
                listDiv.innerHTML = simulations.map(sim => {
                    const createdDate = new Date(sim.created_at);
                    const stateClass = sim.state.toLowerCase().replace('_', '-');
                    const directives = sim.prime_directives || [];
                    
                    return `
                        <div class="realm-browser-item" onclick="loadSimulation('${sim.simulation_id}')">
                            <div class="realm-browser-item-header">
                                <div class="realm-browser-item-id">${sim.simulation_id}</div>
                                <div class="realm-browser-item-state ${stateClass}">${sim.state.toUpperCase()}</div>
                            </div>
                            <div class="realm-browser-item-info">
                                <div><strong>Created:</strong> ${createdDate.toLocaleString()}</div>
                                <div><strong>Cycle:</strong> ${sim.cycle}</div>
                                <div><strong>Realms:</strong> ${sim.realms_count || 0}</div>
                                <div><strong>Beings:</strong> ${sim.beings_count || 0}</div>
                                <div><strong>Tools:</strong> ${sim.tools_count || 0}</div>
                                ${sim.metrics?.tools_aware ? `<div><strong>Aware Tools:</strong> ${sim.metrics.tools_aware}</div>` : ''}
                                ${sim.metrics?.legendary_tools ? `<div><strong>Legendary:</strong> ${sim.metrics.legendary_tools}</div>` : ''}
                            </div>
                            ${directives.length > 0 ? `
                                <div class="realm-browser-item-directives">
                                    <strong>Prime Directives:</strong>
                                    ${directives.map(d => `<div>• ${d}</div>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading simulations:', error);
                listDiv.innerHTML = '<div class="realm-browser-empty">Error loading simulations. Check console for details.</div>';
            }
        }
        
        async function loadSimulation(simulationId) {
            try {
                console.log('Loading simulation:', simulationId);
                const response = await fetch(`/api/simulation/${simulationId}/load`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    alert('Error loading simulation: ' + error);
                    return;
                }
                
                const data = await response.json();
                simulationId = data.simulation_id;
                document.getElementById('simulationId').textContent = `ID: ${simulationId}`;
                
                connectWebSocket();
                updateDisplay(data.state);
                
                hideRealmBrowser();
                console.log('Simulation loaded:', simulationId);
            } catch (error) {
                console.error('Error loading simulation:', error);
                alert('Error: ' + error.message);
            }
        }
        
        function createNewSimulation() {
            hideRealmBrowser();
            // Focus will be on create button, user can click it
        }
        
        async function createSimulation() {
            try {
                console.log('Creating simulation...');
                const numRealms = parseInt(document.getElementById('numRealms').value);
                console.log('Num realms:', numRealms);
                
                const response = await fetch('/api/simulation/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({num_realms: numRealms})
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    alert('Error: ' + response.status + ' - ' + errorText);
                    return;
                }
                
                const data = await response.json();
                console.log('Simulation created:', data);
                simulationId = data.simulation_id;
                document.getElementById('simulationId').textContent = `ID: ${simulationId}`;
                
                connectWebSocket();
                updateDisplay(data.state);
            } catch (error) {
                console.error('Error creating simulation:', error);
                alert('Error: ' + error.message);
            }
        }
        
        async function startSimulation() {
            try {
                if (!simulationId) {
                    alert('Please create a simulation first!');
                    return;
                }
                
                console.log('Starting simulation:', simulationId);
                const batchSize = parseInt(document.getElementById('batchSize').value);
                
                const response = await fetch(`/api/simulation/${simulationId}/start`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({batch_size: batchSize})
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error starting simulation:', errorText);
                    alert('Error starting simulation: ' + errorText);
                    return;
                }
                
                const data = await response.json();
                console.log('Simulation started:', data);
            } catch (error) {
                console.error('Error starting simulation:', error);
                alert('Error: ' + error.message);
            }
        }
        
        async function pauseSimulation() {
            if (!simulationId) return;
            await fetch(`/api/simulation/${simulationId}/pause`, {method: 'POST'});
        }
        
        async function resumeSimulation() {
            if (!simulationId) return;
            
            const batchSize = parseInt(document.getElementById('batchSize').value);
            
            await fetch(`/api/simulation/${simulationId}/resume`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({batch_size: batchSize})
            });
        }
        
        function connectWebSocket() {
            if (!simulationId) return;
            
            ws = new WebSocket(`ws://localhost:8000/ws/${simulationId}`);
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'state_update') {
                    updateDisplay(message.data);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed, reconnecting...');
                setTimeout(() => {
                    if (simulationId) {
                        connectWebSocket();
                    }
                }, 2000);
            };
        }
        
        function updateDisplay(state) {
            // Update status
            document.getElementById('statusText').textContent = state.state.toUpperCase();
            document.getElementById('cycleText').textContent = state.cycle;
            
            // Update metrics
            const metricsDiv = document.getElementById('metrics');
            if (state.metrics) {
                metricsDiv.innerHTML = Object.entries(state.metrics).map(([key, value]) => `
                    <div class="metric">
                        <div class="metric-label">${key.replace(/_/g, ' ').toUpperCase()}</div>
                        <div class="metric-value">${value || 0}</div>
                    </div>
                `).join('');
            } else {
                metricsDiv.innerHTML = '<div class="metric"><div class="metric-label">NO METRICS</div><div class="metric-value">0</div></div>';
            }
            
            // Update realms
            const realmsDiv = document.getElementById('realms');
            realmsDiv.innerHTML = state.realms.map(realm => `
                <div class="realm">
                    <h3>${realm.realm_id}</h3>
                    <div class="realm-info">
                        <div><strong>Prime Directive:</strong> ${realm.prime_directive}</div>
                        <div><strong>Density:</strong> ${realm.density.toFixed(2)}</div>
                        <div><strong>Awareness Level:</strong> ${realm.awareness_level}</div>
                        <div><strong>Beings Spawned:</strong> ${realm.spawned_beings.length}</div>
                        <div><strong>Tools Created:</strong> ${realm.tools_created}</div>
                        <div><strong>Tools Aware:</strong> ${realm.tools_aware}</div>
                    </div>
                </div>
            `).join('');
            
            // Update events
            const eventsDiv = document.getElementById('eventsList');
            if (state.events && state.events.length > 0) {
                eventsDiv.innerHTML = state.events.slice().reverse().map(event => {
                    const timestamp = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() : '--:--:--';
                    return `
                        <div class="event ${event.event_type}">
                            <span class="timestamp">[${timestamp}]</span>
                            <strong>${event.event_type.replace(/_/g, ' ').toUpperCase()}</strong>: ${event.message || 'No message'}
                        </div>
                    `;
                }).join('');
            } else {
                eventsDiv.innerHTML = '<div class="event">No events yet...</div>';
            }
            
            // Auto-scroll events
            eventsDiv.scrollTop = 0;
        }
    </script>
