<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pantheon - WAFT Gods</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 4em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            font-weight: 900;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.5em;
            opacity: 0.9;
            font-weight: 300;
        }

        .pantheon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .god-card {
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .god-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
        }

        .god-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .god-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .god-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }

        .god-icon {
            font-size: 2.5em;
            opacity: 0.8;
        }

        .god-title {
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .god-description {
            font-size: 1em;
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        .god-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: #f5f7fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #1e3c72;
        }

        .god-abilities {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .abilities-title {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .abilities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ability-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-active { background: #2ecc71; }
        .status-dormant { background: #95a5a6; }
        .status-unknown { background: #e74c3c; }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9em;
        }

        .timestamp {
            color: rgba(255,255,255,0.6);
            font-size: 0.85em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .pantheon-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ The Pantheon</h1>
            <div class="subtitle">Higher Beings System • WAFT Gods</div>
            <div class="timestamp" id="timestamp"></div>
        </header>

        <div class="pantheon-grid" id="pantheon-grid">
            <!-- Gods will be populated here -->
        </div>

        <footer class="footer">
            <p>WAFT Pantheon • Timeless Forces that Bind Reality Together</p>
            <p style="margin-top: 10px; font-size: 0.8em;">"As above, so below"</p>
        </footer>
    </div>

    <script>
        // Pantheon Gods Data
        const pantheonGods = [
            {
                name: "Magistrate",
                icon: "⚖️",
                title: "God of Precedent and Body of Proof",
                description: "Organizes proof cases from _work_efforts/proof_cases/ into Precedent categories, building a Body of Proof over time. Maintains the fundamental principle of legal precedent.",
                abilities: ["organize_all_cases", "search_precedents", "get_body_of_proof_summary"],
                status: "active",
                stats: {
                    "Precedents": "2",
                    "Cases": "2",
                    "Status": "Active"
                }
            },
            {
                name: "Judge",
                icon: "👨‍⚖️",
                title: "God of Judgment and Evaluation",
                description: "Evaluates organization claims and references the Magistrate's Body of Proof. Saves judgments to _pantheon/judge/. Provides verdicts with confidence scores.",
                abilities: ["evaluate_claim", "get_judgment_history", "get_judgment_summary"],
                status: "active",
                stats: {
                    "Judgments": "2",
                    "Status": "Active"
                }
            },
            {
                name: "The Reasoner",
                icon: "🧠",
                title: "God of Reasoning Traces and Chain of Thought",
                description: "Maintains traceable reasoning chains showing the 'why' behind decisions. Can extract reasoning from work effort reasoning.md files.",
                abilities: ["create_trace", "get_recent_traces", "build_chain", "search_traces"],
                status: "active",
                stats: {
                    "Traces": "1",
                    "Status": "Active"
                }
            },
            {
                name: "The GitHub God",
                icon: "🐙",
                title: "God of Repository Management and Version Control",
                description: "Maintains repository state, generates rollups, and tracks GitHub operations. A timeless Entity that maintains the fundamental principle of code synchronization.",
                abilities: ["generate_rollup", "get_repository_state", "get_branch_summary"],
                status: "active",
                stats: {
                    "Rollups": "7",
                    "Operations": "1",
                    "Status": "Active"
                }
            },
            {
                name: "The Steward",
                icon: "💎",
                title: "God of Work Efforts",
                description: "The divine intelligence that locks, monitors, organizes, and initiates AI development evolutionary cycles within the Work Efforts system. Manages the entire Work Efforts ecosystem.",
                abilities: ["/think", "/evolve", "/monitor", "/organize", "/lock", "/unlock", "/status", "/secrets"],
                status: "active",
                stats: {
                    "System": "pyrite",
                    "Status": "Active"
                }
            },
            {
                name: "Librarian",
                icon: "📚",
                title: "God of Knowledge and Cataloging",
                description: "Maintains catalogs and reports. Organizes knowledge and documentation.",
                abilities: ["catalog", "organize_reports"],
                status: "active",
                stats: {
                    "Catalog Items": "1",
                    "Reports": "1",
                    "Status": "Active"
                }
            },
            {
                name: "Military Brass",
                icon: "🎖️",
                title: "God of Missions and Operations",
                description: "Manages missions and briefings. Coordinates military-style operations and strategic planning.",
                abilities: ["create_mission", "get_briefings", "missions_registry"],
                status: "active",
                stats: {
                    "Missions": "2",
                    "Status": "Active"
                }
            },
            {
                name: "Mission Control",
                icon: "🚀",
                title: "God of Realm Exploration",
                description: "Controls realm scouting and colonization operations. Tracks realm status and exploration missions.",
                abilities: ["realm_scout", "get_realm_status", "control_registry"],
                status: "active",
                stats: {
                    "Realm Scouts": "3",
                    "Status": "Active"
                }
            },
            {
                name: "Fae",
                icon: "🧚",
                title: "God of Quests",
                description: "Manages quests and quest registry. Coordinates quest-based activities and adventures.",
                abilities: ["create_quest", "get_quests", "quests_registry"],
                status: "active",
                stats: {
                    "Quests": "Active",
                    "Status": "Active"
                }
            },
            {
                name: "The Village",
                icon: "🏘️",
                title: "God of Community",
                description: "Manages village registry and community activities. Coordinates social structures.",
                abilities: ["village_registry"],
                status: "active",
                stats: {
                    "Status": "Active"
                }
            },
            {
                name: "Test Runner",
                icon: "🧪",
                title: "God of Testing",
                description: "Manages test execution and test metadata. Coordinates testing operations.",
                abilities: ["run_tests", "test_metadata"],
                status: "active",
                stats: {
                    "Status": "Active"
                }
            },
            {
                name: "External Drive Realm",
                icon: "💾",
                title: "God of External Storage",
                description: "Manages external drive realm content and storage routing. Tracks content manifests and realm status.",
                abilities: ["content_manifest", "realm_registry", "realm_status"],
                status: "active",
                stats: {
                    "Content Items": "1",
                    "Status": "Active"
                }
            }
        ];

        // Render gods
        function renderPantheon() {
            const grid = document.getElementById('pantheon-grid');
            grid.innerHTML = pantheonGods.map(god => `
                <div class="god-card">
                    <div class="god-header">
                        <div class="god-name">${god.icon} ${god.name}</div>
                        <span class="status-indicator status-${god.status}"></span>
                    </div>
                    <div class="god-title">${god.title}</div>
                    <div class="god-description">${god.description}</div>
                    
                    <div class="god-stats">
                        ${Object.entries(god.stats).map(([key, value]) => `
                            <div class="stat-item">
                                <div class="stat-label">${key}</div>
                                <div class="stat-value">${value}</div>
                            </div>
                        `).join('')}
                    </div>

                    ${god.abilities ? `
                        <div class="god-abilities">
                            <div class="abilities-title">Abilities</div>
                            <div class="abilities-list">
                                ${god.abilities.map(ability => `
                                    <span class="ability-badge">${ability}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Update timestamp
        function updateTimestamp() {
            const timestamp = document.getElementById('timestamp');
            timestamp.textContent = `Last updated: ${new Date().toLocaleString()}`;
        }

        // Initialize
        renderPantheon();
        updateTimestamp();
        setInterval(updateTimestamp, 60000); // Update every minute
    </script>
</body>
</html>
