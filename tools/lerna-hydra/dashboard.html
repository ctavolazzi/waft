<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LERNA HYDRA | Nerve Center</title>
<style>
  :root {
    --bg-deep:    #0c0c0c;
    --bg-panel:   #141414;
    --bg-paper:   #f5f0e6;
    --border:     #3c2a21;
    --accent:     #e07b3c;
    --accent-dim: #a05828;
    --text:       #f5ebdd;
    --text-dim:   #666;
    --text-code:  #9a8;
    --green:      #6a8;
    --red:        #c66;
    --font:       'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  #header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: var(--bg-panel);
    border-bottom: 2px solid var(--border);
    font-size: 12px;
  }
  #header h1 { font-size: 14px; color: var(--accent); letter-spacing: 2px; }
  .badge {
    padding: 2px 8px;
    border: 1px solid var(--border);
    font-size: 11px;
  }
  .badge.running { border-color: var(--green); color: var(--green); }
  .badge.stopped { border-color: var(--red); color: var(--red); }
  .btn {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--accent-dim);
    padding: 4px 12px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 11px;
  }
  .btn:hover { background: var(--accent-dim); }
  .btn.start { border-color: var(--green); }
  .btn.stop { border-color: var(--red); }

  /* Main grid */
  #main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 200px 1.2fr;
    grid-template-rows: 1fr;
    min-height: 0;
    border-bottom: 2px solid var(--border);
  }
  .panel {
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel:last-child { border-right: none; }
  .panel-title {
    flex: 0 0 auto;
    padding: 6px 10px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    font-size: 12px;
    line-height: 1.5;
  }

  /* Tokens */
  .token { animation: blink 0.1s; }
  @keyframes blink { from { background: var(--text); color: #000; } to { background: transparent; } }
  #reasoning-body { color: var(--text-dim); }
  #content-body { color: var(--text); }

  /* File tree */
  #tree-body { font-size: 11px; }
  .tree-entry { padding: 1px 0; cursor: default; }
  .tree-dir { color: var(--accent); }
  .tree-file { color: var(--text-code); }

  /* Preview iframe */
  #preview-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: var(--bg-paper);
  }

  /* Action log */
  #action-log {
    flex: 0 0 140px;
    background: var(--bg-panel);
    border-top: 2px solid var(--border);
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 11px;
  }
  #action-log .panel-title { padding: 0 0 6px; }
  .action-entry { padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
  .action-ok { color: var(--green); }
  .action-err { color: var(--red); }
  .action-tool { color: var(--accent); }
  .action-time { color: var(--text-dim); margin-right: 8px; }
</style>
</head>
<body>

<div id="header">
  <h1>🐉 LERNA HYDRA</h1>
  <span>Step: <span id="step-count">0</span></span>
  <span id="status-badge" class="badge stopped">● STOPPED</span>
  <button class="btn start" onclick="controlStart()">Start</button>
  <button class="btn stop" onclick="controlStop()">Stop</button>
  <button class="btn" onclick="controlReset()">Reset</button>
</div>

<div id="main">
  <div class="panel">
    <div class="panel-title">💭 Reasoning</div>
    <div class="panel-body" id="reasoning-body"></div>
  </div>
  <div class="panel">
    <div class="panel-title">📡 Response</div>
    <div class="panel-body" id="content-body"></div>
  </div>
  <div class="panel">
    <div class="panel-title">📁 File Tree</div>
    <div class="panel-body" id="tree-body"></div>
  </div>
  <div class="panel" style="border-right:none;">
    <div class="panel-title">🖼️ Live Preview — index.html</div>
    <iframe id="preview-frame" src="/sandbox/index.html"></iframe>
  </div>
</div>

<div id="action-log">
  <div class="panel-title">⚡ Action Log</div>
  <div id="log-entries"></div>
</div>

<script>
const reasoningEl = document.getElementById('reasoning-body');
const contentEl = document.getElementById('content-body');
const treeEl = document.getElementById('tree-body');
const logEl = document.getElementById('log-entries');
const stepEl = document.getElementById('step-count');
const statusEl = document.getElementById('status-badge');
const previewFrame = document.getElementById('preview-frame');

let currentStep = 0;

// ---- SSE Connection ----
function connectSSE() {
  const es = new EventSource('/api/sse');

  es.addEventListener('reasoning', (e) => {
    const { token } = JSON.parse(e.data);
    appendToken(reasoningEl, token);
  });

  es.addEventListener('content', (e) => {
    const { token } = JSON.parse(e.data);
    appendToken(contentEl, token);
  });

  es.addEventListener('file_tree', (e) => {
    const { files } = JSON.parse(e.data);
    renderTree(files);
  });

  es.addEventListener('action_request', (e) => {
    const data = JSON.parse(e.data);
    addLogEntry(`→ ${data.tool}(${data.path || ''})`, 'action-tool');
  });

  es.addEventListener('action_result', (e) => {
    const data = JSON.parse(e.data);
    const cls = data.ok ? 'action-ok' : 'action-err';
    const detail = data.ok ? '✓' : `✗ ${data.error || ''}`;
    addLogEntry(`  ${detail} ${data.tool || ''} ${data.path || ''}`, cls);

    // Reload preview if index.html was written
    if (data.ok && data.path === 'index.html') {
      previewFrame.src = '/sandbox/index.html?t=' + Date.now();
    }
  });

  es.addEventListener('loop_status', (e) => {
    const { status, step } = JSON.parse(e.data);
    currentStep = step || 0;
    stepEl.textContent = currentStep;
    statusEl.textContent = status === 'running' ? '● RUNNING' : '● STOPPED';
    statusEl.className = 'badge ' + (status === 'running' ? 'running' : 'stopped');

    // Clear streams on new step
    if (status === 'running' && step > 0) {
      reasoningEl.innerHTML = '';
      contentEl.innerHTML = '';
    }
  });

  es.addEventListener('error', (e) => {
    try {
      const { message } = JSON.parse(e.data);
      addLogEntry(`ERROR: ${message}`, 'action-err');
    } catch {
      // SSE connection error, will auto-reconnect
    }
  });

  es.onerror = () => {
    statusEl.textContent = '● DISCONNECTED';
    statusEl.className = 'badge stopped';
  };
}

function appendToken(el, token) {
  const span = document.createElement('span');
  span.className = 'token';
  span.textContent = token;
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

function renderTree(files) {
  treeEl.innerHTML = '';
  for (const f of files) {
    const div = document.createElement('div');
    div.className = 'tree-entry ' + (f.type === 'dir' ? 'tree-dir' : 'tree-file');
    const icon = f.type === 'dir' ? '📁' : '📄';
    const size = f.type === 'file' ? ` (${f.size}b)` : '';
    div.textContent = `${icon} ${f.name}${size}`;
    treeEl.appendChild(div);
  }
}

function addLogEntry(text, cls) {
  const div = document.createElement('div');
  div.className = 'action-entry ' + (cls || '');
  const time = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="action-time">${time}</span>${text}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---- Controls ----
async function controlStart() {
  await fetch('/api/control/start', { method: 'POST' });
}
async function controlStop() {
  await fetch('/api/control/stop', { method: 'POST' });
}
async function controlReset() {
  await fetch('/api/control/reset', { method: 'POST' });
  reasoningEl.innerHTML = '';
  contentEl.innerHTML = '';
  logEl.innerHTML = '';
  previewFrame.src = '/sandbox/index.html?t=' + Date.now();
}

// ---- Init ----
connectSSE();
</script>
</body>
</html>
