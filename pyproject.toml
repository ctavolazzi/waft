[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waft"
version = "0.9.4"
description = "Waft - Ambient, self-modifying Meta-Framework for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Waft Team"}
]
keywords = ["meta-framework", "project-scaffolding", "uv", "python", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "empirica>=1.2.3",
    "tinydb>=4.8.0",
    "d20>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "fpdf2>=2.7.0",
    "beautifulsoup4>=4.14.0",
    "jinja2>=3.0.0",
    "pypdf>=4.0.0",
    "weasyprint>=68.0",
    "markdown>=3.10.1",
    "streamlit>=1.53.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "watchdog>=3.0.0",
]
crewai = [
    "crewai>=0.1.0",
]
tavern-keeper = [
    "tracery>=0.1.1",
]

[project.scripts]
waft = "waft.main:main"

[project.urls]
Homepage = "https://github.com/ctavolazzi/waft"
Repository = "https://github.com/ctavolazzi/waft"
Issues = "https://github.com/ctavolazzi/waft/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["waft", "waft.core", "waft.cli", "waft.templates", "waft.ui", "waft.api"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Exclude legacy/experimental directories and files from linting
exclude = [
    # Non-waft packages
    "src/gym",
    # Root-level Python scripts (legacy/demo)
    "/*.py",
    # Underscore-prefixed experimental directories
    "_*",
    # Legacy project directories
    "Bubbles",
    "Campaigns",
    "Latex Source Code",
    "NARRATIVE-WAFT",
    "Obsidian_Archive",
    "WAFT-Mac-Shortcuts-Research",
    "WAFT-One-Pager-Feature-Research",
    "WAFT-PDF-PNG-Conversion-Research",
    # Demo and output directories
    "advanced_demo_output",
    "demo_output",
    "demo",
    "demo_template",
    # API and frontend
    "api",
    "biz-report",
    "book-waft-command-discovery",
    "cli",
    "cute_test_runner",
    "dnd_campaign_desktop_app",
    "docs",
    "examples",
    "experiments",
    "frontend",
    "hotel_staff",
    "invoice-maker",
    "lib",
    "modern-cv",
    "playground",
    "playwright",
    "react-being-test",
    "recap_review_app",
    "research_simulation",
    "s6t5-page-bordering",
    "saved_decisions",
    "scientific_method_tool",
    "scripts",
    "templates",
    "tools",
    "unofficial-fhict-document-template",
    "visualizer",
    "waft_desktop",
    "web",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = ["_experiments/test_project_001", "_experiments/existing_project", "_experiments/test_project_002", "_experiments/test_project_001/nested_project"]
