[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waft"
version = "0.9.1"
description = "Waft - Ambient, self-modifying Meta-Framework for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Waft Team"}
]
keywords = ["meta-framework", "project-scaffolding", "uv", "python", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "empirica>=1.2.3",
    "tinydb>=4.8.0",
    "d20>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "fpdf2>=2.7.0",
    "pypdf>=3.0.0",  # For real page counting in TwoPageGeneratorV2
    "pillow>=10.0.0",  # For PDF/PNG conversion
    "streamlit>=1.28.0",  # For waft_larva.py UI
    "pandas>=2.0.0",  # For waft_larva.py data handling
    "pyserial>=3.5",  # For waft_larva.py serial communication
    "markdown>=3.4.0",  # For markdown to HTML conversion in PDF generation
    "cryptography>=41.0.0",  # For Pyrite secrets encryption
    "pyyaml>=6.0",  # For YAML frontmatter parsing in work effort service
    # RAG Chatbot dependencies
    "gradio<5",
    "python-dotenv>=1.0.1,<2",
    "llama-index-embeddings-huggingface>=0.1.4,<0.2",
    "llama-index-llms-openai>=0.1.12,<0.2",
    "llama-index-vector-stores-chroma>=0.1.6,<0.2",
    "llama-index-llms-ollama>=0.1.2,<0.2",
    "llama-index-readers-file>=0.1.11,<0.2",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "watchdog>=3.0.0",
]
crewai = [
    "crewai>=0.1.0",
]
tavern-keeper = [
    "tracery>=0.1.1",
]
rag = [
    "gradio<5",
    "python-dotenv>=1.0.1,<2",
    "llama-index-embeddings-huggingface>=0.1.4,<0.2",
    "llama-index-llms-openai>=0.1.12,<0.2",
    "llama-index-vector-stores-chroma>=0.1.6,<0.2",
    "llama-index-llms-ollama>=0.1.2,<0.2",
    "llama-index-readers-file>=0.1.11,<0.2",
    "llama-index>=0.10.22,<0.11",
    # Note: torch and transformers are required by RAG but may not install on macOS x86_64
    # Install manually if needed: pip install torch transformers
    "llama-index-callbacks-wandb>=0.1.2,<0.2",
    "llama-index-retrievers-bm25>=0.1.3,<0.2",
    "pymupdf>=1.24.3,<2",
    "tqdm>=4.66.4,<5",
]

[project.scripts]
waft = "waft.main:main"

[project.urls]
Homepage = "https://github.com/ctavolazzi/waft"
Repository = "https://github.com/ctavolazzi/waft"
Issues = "https://github.com/ctavolazzi/waft/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["waft", "waft.core", "waft.cli", "waft.templates", "waft.ui", "waft.api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = ["_experiments/test_project_001", "_experiments/existing_project", "_experiments/test_project_002", "_experiments/test_project_001/nested_project"]