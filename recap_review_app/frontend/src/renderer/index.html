<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy (tutorial best practice) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Recap and Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Recap and Review</h1>
            <p class="subtitle">Capture your mindspace and generate review documents</p>
        </header>

        <div class="status-bar">
            <div id="api-status" class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Checking API...</span>
            </div>
        </div>

        <main>
            <section class="input-section">
                <h2>Project Configuration</h2>
                <div class="form-group">
                    <label for="project-path">Project Path (optional):</label>
                    <input 
                        type="text" 
                        id="project-path" 
                        placeholder="Leave empty for current directory"
                    >
                    <button id="browse-btn" class="btn-secondary">Browse</button>
                </div>
            </section>

            <section class="action-section">
                <button id="generate-btn" class="btn-primary" disabled>
                    📄 Generate Mindspace Review
                </button>
            </section>

            <section class="output-section" id="output-section" style="display: none;">
                <h2>Results</h2>
                <div id="results" class="results"></div>
            </section>

            <section class="loading-section" id="loading-section" style="display: none;">
                <div class="spinner"></div>
                <p>Generating mindspace review...</p>
            </section>
        </main>

        <footer>
            <p>Recap and Review App v1.0.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
