<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheGuide | Console Goblin</title>
    <style>
        :root { 
            --bg: #0a0a0a; 
            --text: #e0e0e0; 
            --accent: #00ff9d; 
            --panel: #1a1a1a;
            --danger: #ff0055;
            --warning: #ffaa00;
            --info: #0099ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Courier New', monospace; 
            display: grid; 
            grid-template-rows: auto 1fr; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        header { 
            border-bottom: 1px solid #333; 
            display: flex; 
            align-items: center; 
            padding: 10px 15px; 
            justify-content: space-between;
            background: var(--panel);
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { 
            font-size: clamp(0.8rem, 2vw, 1.2rem); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin: 0; 
            color: var(--accent); 
        }
        .goblin-icon {
            font-size: 1.2em;
            margin-right: 5px;
        }
        .status { 
            font-size: clamp(0.65rem, 1.5vw, 0.8rem); 
            color: #666; 
            white-space: nowrap;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        main { 
            display: grid; 
            grid-template-columns: minmax(250px, 350px) 1fr minmax(200px, 300px); 
            gap: 1px; 
            background: #333;
            overflow: hidden;
        }
        .panel { 
            background: var(--panel); 
            padding: clamp(10px, 2vw, 20px); 
            overflow-y: auto; 
            min-width: 0;
        }
        .panel h3 {
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .center-stage { 
            background: #000; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px;
            min-width: 0;
        }
        canvas { 
            border: 1px solid #333; 
            box-shadow: 0 0 20px rgba(0,255,157,0.1);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        
        /* Console Goblin Log Styles */
        #logs {
            font-size: 0.75rem;
            line-height: 1.5;
            word-break: break-word;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .log-time {
            color: #444;
            font-size: 0.65rem;
            min-width: 70px;
            flex-shrink: 0;
        }
        .log-source {
            color: #666;
            font-size: 0.65rem;
            min-width: 60px;
            flex-shrink: 0;
        }
        .log-message {
            flex: 1;
        }
        .log-entry.success { color: var(--accent); }
        .log-entry.success .log-message { color: var(--accent); }
        .log-entry.warning { color: var(--warning); }
        .log-entry.warning .log-message { color: var(--warning); }
        .log-entry.error { color: var(--danger); }
        .log-entry.error .log-message { color: var(--danger); }
        .log-entry.active { color: var(--info); }
        .log-entry.active .log-message { color: var(--info); }
        .log-entry.info { color: #888; }
        .log-entry.info .log-message { color: #aaa; }
        
        /* FVCU Metrics */
        .fvcu-grid {
            display: grid;
            gap: 12px;
        }
        .fvcu-item {
            padding: 10px;
            background: #222;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }
        .fvcu-label {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .fvcu-value {
            font-size: 1rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 6px;
        }
        .bar-bg { 
            background: #111; 
            height: 6px; 
            width: 100%; 
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-fg { 
            background: var(--accent); 
            height: 100%; 
            width: 0%; 
            transition: width 0.3s ease-out; 
            border-radius: 3px;
        }
        .bar-fg.danger { background: var(--danger); }
        .bar-fg.warning { background: var(--warning); }
        
        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .panel { max-height: 200px; }
            .center-stage { min-height: 400px; }
            #logs { max-height: 180px; }
        }
        
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; padding: 10px; }
            h1 { font-size: 0.9rem; }
            main { grid-template-columns: 1fr; }
            .panel { max-height: 150px; padding: 15px; }
            .center-stage { min-height: 300px; padding: 5px; }
            #logs { max-height: 130px; }
        }
        
        @media (max-width: 480px) {
            header h1 span { display: none; }
            .panel { max-height: 120px; padding: 10px; }
            .center-stage { min-height: 250px; }
            #logs { font-size: 0.65rem; max-height: 100px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="goblin-icon">🧙</span> Console Goblin <span style="font-size:0.5em; opacity:0.5;">// REACTIVE EVENT STREAM</span></h1>
        <div class="status"><span class="status-dot"></span>HOMEBASE | PORT: 8008 | SSE MODE</div>
    </header>
    <main>
        <div class="panel">
            <h3>🧙 GOBLIN LOG STREAM</h3>
            <div id="logs">
                <!-- Logs will be populated by Console Goblin -->
            </div>
        </div>
        <div class="center-stage">
            <canvas id="threeBody" width="600" height="400"></canvas>
        </div>
        <div class="panel">
            <h3>📊 FVCU ANALYSIS</h3>
            <div class="fvcu-grid">
                <div class="fvcu-item" data-metric="factuality">
                    <div class="fvcu-label">FACTUALITY</div>
                    <div class="fvcu-value">--</div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 0%"></div></div>
                </div>
                <div class="fvcu-item" data-metric="validity">
                    <div class="fvcu-label">VALIDITY</div>
                    <div class="fvcu-value">--</div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 0%"></div></div>
                </div>
                <div class="fvcu-item" data-metric="coherence">
                    <div class="fvcu-label">COHERENCE</div>
                    <div class="fvcu-value">--</div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 0%"></div></div>
                </div>
                <div class="fvcu-item" data-metric="utility">
                    <div class="fvcu-label">UTILITY</div>
                    <div class="fvcu-value">--</div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 0%"></div></div>
                </div>
                <div class="fvcu-item" data-metric="faithfulness">
                    <div class="fvcu-label">FAITHFULNESS</div>
                    <div class="fvcu-value">--</div>
                    <div class="bar-bg"><div class="bar-fg" style="width: 0%"></div></div>
                </div>
            </div>
        </div>
    </main>
    <script>
        // =============================================
        // 3-Body Orbital Animation
        // =============================================
        const canvas = document.getElementById('threeBody');
        const ctx = canvas.getContext('2d');
        let t = 0;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = container.clientWidth - 20;
            const maxHeight = container.clientHeight - 20;
            const aspectRatio = 600 / 400;
            
            let width = maxWidth;
            let height = width / aspectRatio;
            
            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }
            
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            t += 0.05;
            const cx = canvas.width / 2; 
            const cy = canvas.height / 2;
            const baseRadius = Math.min(canvas.width, canvas.height) * 0.15;
            
            // Mind (Red)
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            const x1 = cx + Math.cos(t) * baseRadius;
            const y1 = cy + Math.sin(t * 1.3) * (baseRadius * 0.8);
            ctx.arc(x1, y1, Math.max(3, baseRadius * 0.05), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,0,85,0.2)';
            ctx.beginPath();
            ctx.arc(x1, y1, Math.max(6, baseRadius * 0.1), 0, Math.PI * 2);
            ctx.fill();
            
            // Body (Green)
            ctx.fillStyle = '#00ff9d';
            ctx.beginPath();
            const x2 = cx + Math.cos(t + 2) * (baseRadius * 1.5);
            const y2 = cy + Math.sin(t * 0.8) * (baseRadius * 1.5);
            ctx.arc(x2, y2, Math.max(4, baseRadius * 0.06), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,255,157,0.2)';
            ctx.beginPath();
            ctx.arc(x2, y2, Math.max(8, baseRadius * 0.12), 0, Math.PI * 2);
            ctx.fill();
            
            // Spirit (Blue)
            ctx.fillStyle = '#0099ff';
            ctx.beginPath();
            const x3 = cx + Math.cos(t * 0.7 + 4) * (baseRadius * 1.2);
            const y3 = cy + Math.sin(t * 1.1) * (baseRadius * 1.2);
            ctx.arc(x3, y3, Math.max(2, baseRadius * 0.04), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,153,255,0.2)';
            ctx.beginPath();
            ctx.arc(x3, y3, Math.max(5, baseRadius * 0.08), 0, Math.PI * 2);
            ctx.fill();
            
            // Connection lines
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.closePath();
            ctx.stroke();

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
