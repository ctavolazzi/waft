<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oracle Profile</title>
    <style>
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .wrap { max-width: 920px; margin: 0 auto; padding: 20px; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
      .muted { color: #64748b; }
      input, button { width: 100%; box-sizing: border-box; border-radius: 8px; }
      input { border: 1px solid #cbd5e1; padding: 10px; margin-bottom: 10px; font-size: 14px; }
      button { border: 0; background: #0f172a; color: #fff; padding: 10px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      pre { white-space: pre-wrap; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 8px; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/api/pantheon/oracle-cycle/ui/profile/app.mjs"></script>
  </body>
</html>
