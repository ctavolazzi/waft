<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }
        
        .card h2 {
            color: #a78bfa;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat {
            text-align: center;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fbbf24;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .abilities {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        
        .ability {
            text-align: center;
            padding: 10px;
            background: #0f172a;
            border-radius: 6px;
        }
        
        .ability-name {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        
        .ability-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e2e8f0;
        }
        
        .ability-mod {
            font-size: 0.9rem;
            color: #fbbf24;
        }
        
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #a78bfa;
        }
        
        button {
            padding: 12px 24px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #6d28d9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid;
        }
        
        .message-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
            color: #6ee7b7;
        }
        
        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #fca5a5;
        }
        
        .message-info {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #93c5fd;
        }
        
        .combat {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
        }
        
        .enemy {
            text-align: center;
            padding: 20px;
            background: #0f172a;
            border-radius: 6px;
            margin: 15px 0;
        }
        
        .enemy-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 10px;
        }
        
        .hp-bar {
            width: 100%;
            height: 30px;
            background: #0f172a;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid #334155;
        }
        
        .hp-fill {
            height: 100%;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.3s;
        }
        
        .hp-fill.danger {
            background: #ef4444;
        }
        
        .shop-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .shop-item {
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        
        .shop-item-name {
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 5px;
        }
        
        .shop-item-cost {
            color: #fbbf24;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .hidden {
            display: none;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .equipment {
            margin-top: 15px;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
        }
        
        .equipment p {
            margin: 8px 0;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ D&D Game</h1>
        
        <div class="grid">
            <!-- Character Creation -->
            <div id="character-creation" class="card">
                <h2>Create Character</h2>
                <label>Character Name</label>
                <input type="text" id="character-name" placeholder="Enter name" value="Adventurer">
                <button onclick="createCharacter()" style="width: 100%; margin: 0;">Create Character</button>
            </div>
            
            <!-- Character Sheet -->
            <div id="character-sheet" class="card hidden">
                <h2>Character Sheet</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="stat-hp">-</div>
                        <div class="stat-label">HP</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-ac">-</div>
                        <div class="stat-label">AC</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-level">-</div>
                        <div class="stat-label">Level</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-gold">-</div>
                        <div class="stat-label">Gold</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-encounters">-</div>
                        <div class="stat-label">Encounters</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-proficiency">-</div>
                        <div class="stat-label">Prof</div>
                    </div>
                </div>
                
                <h3 style="margin: 20px 0 10px 0; color: #a78bfa; font-size: 1.1rem;">Abilities</h3>
                <div class="abilities" id="ability-scores"></div>
                
                <div class="equipment">
                    <p><strong>Weapon:</strong> <span id="equipped-weapon">None</span></p>
                    <p><strong>Armor:</strong> <span id="equipped-armor">None</span></p>
                </div>
            </div>
            
            <!-- Actions -->
            <div id="game-actions" class="card hidden">
                <h2>Actions</h2>
                <div class="actions">
                    <button onclick="explore()">Explore</button>
                    <button class="btn-success" onclick="rest()">Rest</button>
                    <button class="btn-warning" onclick="openShop()">Shop</button>
                    <button class="btn-danger" onclick="startCombat()">Combat</button>
                    <button style="background: #8b5cf6;" onclick="openQuests()">Quests</button>
                    <button style="background: #06b6d4;" onclick="openLocations()">Travel</button>
                    <button style="background: #14b8a6;" onclick="openInventory()">Inventory</button>
                    <button style="background: #64748b;" onclick="openSaveLoad()">Save/Load</button>
                </div>
                <div id="action-messages"></div>
            </div>
            
            <!-- Combat -->
            <div id="combat-panel" class="card combat hidden">
                <h2>Combat</h2>
                <div id="combat-enemy"></div>
                <div class="actions">
                    <button class="btn-danger" onclick="combatAction('attack')">Attack</button>
                    <button class="btn-warning" onclick="combatAction('flee')">Flee</button>
                    <button style="background: #ec4899;" onclick="openSpells()">Cast Spell</button>
                </div>
                <div id="combat-messages"></div>
            </div>
            
            <!-- Spells -->
            <div id="spells-panel" class="card hidden">
                <h2>Cast Spell</h2>
                <div id="spells-list"></div>
                <button onclick="closeSpells()" style="width: 100%; margin-top: 15px;">Cancel</button>
            </div>
            
            <!-- Shop -->
            <div id="shop-panel" class="card hidden">
                <h2>Shop</h2>
                <p>Gold: <strong id="shop-gold" style="color: #fbbf24;">0</strong> gp</p>
                <div class="shop-items" id="shop-items"></div>
                <button onclick="closeShop()" style="width: 100%; margin-top: 15px;">Close</button>
            </div>
            
            <!-- Quests -->
            <div id="quest-panel" class="card hidden">
                <h2>Quests</h2>
                <div id="active-quests"></div>
                <h3 style="margin: 20px 0 10px 0; color: #a78bfa; font-size: 1.1rem;">Available Quests</h3>
                <div id="available-quests"></div>
                <button onclick="closeQuests()" style="width: 100%; margin-top: 15px;">Close</button>
            </div>
        </div>
    </div>
    
    <script>
        let gameId = null;
        let gameState = null;
        let shopItems = null;
        
        async function createCharacter() {
            const name = document.getElementById('character-name').value || 'Adventurer';
            try {
                const response = await fetch('/api/create-character', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name})
                });
                const data = await response.json();
                gameId = data.game_id;
                gameState = data;
                document.getElementById('character-creation').classList.add('hidden');
                document.getElementById('character-sheet').classList.remove('hidden');
                document.getElementById('game-actions').classList.remove('hidden');
                updateCharacterSheet();
                loadShopItems();
                showMessage('Character created!', 'success');
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadGameState() {
            if (!gameId) return;
            try {
                const response = await fetch(`/api/game/${gameId}`);
                gameState = await response.json();
                updateCharacterSheet();
            } catch (error) {
                showMessage('Error loading state', 'error');
            }
        }
        
        function updateCharacterSheet() {
            if (!gameState?.character) return;
            const char = gameState.character;
            document.getElementById('stat-hp').textContent = `${char.hp}/${char.max_hp}`;
            document.getElementById('stat-ac').textContent = char.ac || 10;
            document.getElementById('stat-level').textContent = char.level;
            document.getElementById('stat-gold').textContent = gameState.gold || 0;
            document.getElementById('stat-encounters').textContent = gameState.encounters_completed || 0;
            document.getElementById('stat-proficiency').textContent = `+${Math.ceil(char.level / 4) + 1}`;
            
            const abilities = ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'];
            document.getElementById('ability-scores').innerHTML = abilities.map(ability => {
                const score = char.ability_scores[ability];
                const mod = Math.floor((score - 10) / 2);
                return `
                    <div class="ability">
                        <div class="ability-name">${ability.substring(0, 3).toUpperCase()}</div>
                        <div class="ability-value">${score}</div>
                        <div class="ability-mod">${mod >= 0 ? '+' : ''}${mod}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('equipped-weapon').textContent = char.equipment?.weapon || 'None';
            document.getElementById('equipped-armor').textContent = char.equipment?.armor || 'None';
        }
        
        async function explore() {
            if (!gameId) return;
            try {
                const response = await fetch('/api/game/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, action: 'explore'})
                });
                const data = await response.json();
                showMessage(data.message, 'info');
                if (data.data.gold_found) {
                    showMessage(`Found ${data.data.gold_found} gp!`, 'success');
                }
                if (data.data.encounter && confirm('Encounter! Start combat?')) {
                    startCombat();
                }
                await loadGameState();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function rest() {
            if (!gameId) return;
            try {
                const response = await fetch('/api/game/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, action: 'rest'})
                });
                const data = await response.json();
                showMessage(data.message, 'success');
                await loadGameState();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadShopItems() {
            try {
                const response = await fetch('/api/shop/items');
                shopItems = (await response.json()).items;
            } catch (error) {
                showMessage('Error loading shop', 'error');
            }
        }
        
        function openShop() {
            if (!shopItems) {
                loadShopItems();
                return;
            }
            document.getElementById('shop-gold').textContent = gameState.gold;
            document.getElementById('shop-items').innerHTML = Object.entries(shopItems).map(([key, item]) => `
                <div class="shop-item">
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-cost">${item.cost} gp</div>
                    <button onclick="purchaseItem('${key}')" ${gameState.gold < item.cost ? 'disabled' : ''} style="width: 100%; margin: 0;">Buy</button>
                </div>
            `).join('');
            document.getElementById('shop-panel').classList.remove('hidden');
            document.getElementById('game-actions').classList.add('hidden');
        }
        
        function closeShop() {
            document.getElementById('shop-panel').classList.add('hidden');
            document.getElementById('game-actions').classList.remove('hidden');
        }
        
        async function purchaseItem(itemKey) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/shop/purchase', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, item_key: itemKey})
                });
                const data = await response.json();
                showMessage(data.message, 'success');
                await loadGameState();
                openShop();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function startCombat(enemyType = null) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/game/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, action: 'start-combat', data: enemyType ? {enemy_type: enemyType} : {}})
                });
                const data = await response.json();
                await loadGameState();
                document.getElementById('combat-panel').classList.remove('hidden');
                document.getElementById('game-actions').classList.add('hidden');
                updateCombatDisplay(data.data.enemy);
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function updateCombatDisplay(enemy) {
            const hpPercent = (enemy.current_hp / enemy.hp) * 100;
            document.getElementById('combat-enemy').innerHTML = `
                <div class="enemy">
                    <div class="enemy-name">${enemy.name}</div>
                    <div>AC: ${enemy.ac}</div>
                    <div class="hp-bar">
                        <div class="hp-fill ${hpPercent < 30 ? 'danger' : ''}" style="width: ${hpPercent}%">${enemy.current_hp}/${enemy.hp}</div>
                    </div>
                </div>
            `;
        }
        
        async function combatAction(action) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/combat/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, action})
                });
                const data = await response.json();
                
                let msg = '';
                if (data.player_result.hit) {
                    msg += `Hit for ${data.player_result.damage} damage! `;
                    if (data.player_result.critical) msg += 'CRITICAL! ';
                } else if (data.player_result.fled === false) {
                    msg += 'Missed! ';
                }
                if (data.enemy_result.hit) {
                    msg += `Enemy hits for ${data.enemy_result.damage}! `;
                } else if (data.enemy_result.hit === false) {
                    msg += 'Enemy misses! ';
                }
                if (msg) showCombatMessage(msg, 'info');
                
                if (data.combat_over) {
                    showCombatMessage(data.message, data.victory ? 'success' : 'error');
                    if (data.level_up) {
                        showCombatMessage(`LEVEL UP! Level ${data.new_level}!`, 'success');
                    }
                    setTimeout(() => {
                        document.getElementById('combat-panel').classList.add('hidden');
                        document.getElementById('game-actions').classList.remove('hidden');
                        document.getElementById('combat-messages').innerHTML = '';
                    }, 2000);
                } else {
                    updateCombatDisplay(data.enemy);
                }
                await loadGameState();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function showMessage(msg, type) {
            const div = document.getElementById('action-messages');
            const el = document.createElement('div');
            el.className = `message message-${type}`;
            el.textContent = msg;
            div.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
        
        function showCombatMessage(msg, type) {
            const div = document.getElementById('combat-messages');
            const el = document.createElement('div');
            el.className = `message message-${type}`;
            el.textContent = msg;
            div.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
        
        async function openQuests() {
            if (!gameId) return;
            try {
                const response = await fetch(`/api/game/${gameId}/quests`);
                const data = await response.json();
                
                // Show active quests
                const activeDiv = document.getElementById('active-quests');
                if (data.active && data.active.length > 0) {
                    activeDiv.innerHTML = '<h3 style="margin: 0 0 15px 0; color: #a78bfa; font-size: 1.1rem;">Active Quests</h3>' +
                        data.active.map(quest => {
                            const progress = gameState.quest_progress?.[quest.id] || {};
                            const objectives = progress.objectives || quest.objectives || [];
                            const completed = progress.objectives_completed || [];
                            return `
                                <div class="quest-item">
                                    <div class="quest-name">${quest.name}</div>
                                    <div class="quest-description">${quest.description}</div>
                                    <div class="quest-objectives">
                                        ${objectives.map(obj => 
                                            `<span class="objective ${completed.includes(obj) ? 'completed' : ''}">${obj.replace(/_/g, ' ')}</span>`
                                        ).join('')}
                                    </div>
                                    <div class="quest-rewards">Rewards: ${quest.rewards.xp} XP, ${quest.rewards.gold} gp</div>
                                    <button onclick="completeQuest('${quest.id}')" style="margin-top: 10px;">Complete Quest</button>
                                    <button onclick="abandonQuest('${quest.id}')" style="margin-top: 10px; margin-left: 5px; background: #64748b;">Abandon</button>
                                </div>
                            `;
                        }).join('');
                } else {
                    activeDiv.innerHTML = '<p style="color: #94a3b8;">No active quests</p>';
                }
                
                // Show available quests
                const availableDiv = document.getElementById('available-quests');
                if (data.available && data.available.length > 0) {
                    availableDiv.innerHTML = data.available.map(quest => `
                        <div class="quest-item">
                            <div class="quest-name">${quest.name}</div>
                            <div class="quest-description">${quest.description}</div>
                            <div class="quest-rewards">Rewards: ${quest.rewards.xp} XP, ${quest.rewards.gold} gp${quest.rewards.item ? ', ' + quest.rewards.item : ''}</div>
                            <button onclick="acceptQuest('${quest.id}')" style="margin-top: 10px;">Accept Quest</button>
                        </div>
                    `).join('');
                } else {
                    availableDiv.innerHTML = '<p style="color: #94a3b8;">No available quests</p>';
                }
                
                document.getElementById('quest-panel').classList.remove('hidden');
                document.getElementById('game-actions').classList.add('hidden');
            } catch (error) {
                showMessage('Error loading quests: ' + error.message, 'error');
            }
        }
        
        function closeQuests() {
            document.getElementById('quest-panel').classList.add('hidden');
            document.getElementById('game-actions').classList.remove('hidden');
        }
        
        async function acceptQuest(questId) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/quest/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, quest_id: questId, action: 'accept'})
                });
                const data = await response.json();
                showMessage(data.message, 'success');
                await loadGameState();
                openQuests();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function completeQuest(questId) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/quest/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, quest_id: questId, action: 'complete'})
                });
                const data = await response.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                    if (data.rewards) {
                        showMessage(`Rewards: ${data.rewards.xp} XP, ${data.rewards.gold} gp${data.rewards.item ? ', ' + data.rewards.item : ''}`, 'success');
                    }
                } else {
                    showMessage(data.message, 'error');
                }
                await loadGameState();
                openQuests();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function abandonQuest(questId) {
            if (!gameId) return;
            if (!confirm('Abandon this quest?')) return;
            try {
                const response = await fetch('/api/quest/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_id: gameId, quest_id: questId, action: 'abandon'})
                });
                const data = await response.json();
                showMessage(data.message, 'info');
                await loadGameState();
                openQuests();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function openLocations() {
            if (!gameId) return;
            try {
                const response = await fetch('/api/locations');
                const locations = (await response.json()).locations;
                
                await loadGameState();
                const currentLoc = gameState.current_location || 'town';
                document.getElementById('location-name').textContent = locations[currentLoc]?.name || 'Unknown';
                
                const listDiv = document.getElementById('locations-list');
                listDiv.innerHTML = Object.entries(locations).map(([key, loc]) => `
                    <div class="quest-item" style="${key === currentLoc ? 'border: 2px solid #a78bfa;' : ''}">
                        <div class="quest-name">${loc.name} ${key === currentLoc ? '(Current)' : ''}</div>
                        <div class="quest-description">${loc.description}</div>
                        ${key !== currentLoc ? `<button onclick="travelTo('${key}')" style="margin-top: 10px;">Travel Here</button>` : ''}
                    </div>
                `).join('');
                
                document.getElementById('locations-panel').classList.remove('hidden');
                document.getElementById('game-actions').classList.add('hidden');
            } catch (error) {
                showMessage('Error loading locations: ' + error.message, 'error');
            }
        }
        
        function closeLocations() {
            document.getElementById('locations-panel').classList.add('hidden');
            document.getElementById('game-actions').classList.remove('hidden');
        }
        
        async function travelTo(locationId) {
            if (!gameId) return;
            try {
                const response = await fetch('/api/game/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        game_id: gameId,
                        action: 'travel',
                        data: {location: locationId}
                    })
                });
                const data = await response.json();
                showMessage(data.message, 'success');
                await loadGameState();
                openLocations();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function openInventory() {
            if (!gameId) return;
            try {
                const response = await fetch(`/api/game/${gameId}/inventory`);
                const data = await response.json();
                
                const listDiv = document.getElementById('inventory-list');
                if (data.inventory && data.inventory.length > 0) {
                    listDiv.innerHTML = data.inventory.map(item => `
                        <div class="quest-item">
                            <div class="quest-name">${item.name}</div>
                            <div class="quest-description">Type: ${item.type || 'Unknown'}</div>
                            ${item.damage ? `<div style="color: #ef4444; margin-top: 5px;">Damage: ${item.damage}</div>` : ''}
                            ${item.ac ? `<div style="color: #3b82f6; margin-top: 5px;">AC: ${item.ac}</div>` : ''}
                            ${item.ac_bonus ? `<div style="color: #3b82f6; margin-top: 5px;">AC Bonus: +${item.ac_bonus}</div>` : ''}
                            ${item.healing ? `<div style="color: #10b981; margin-top: 5px;">Healing: ${item.healing}</div>` : ''}
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = '<p style="color: #94a3b8;">Inventory is empty</p>';
                }
                
                document.getElementById('inventory-panel').classList.remove('hidden');
                document.getElementById('game-actions').classList.add('hidden');
            } catch (error) {
                showMessage('Error loading inventory: ' + error.message, 'error');
            }
        }
        
        function closeInventory() {
            document.getElementById('inventory-panel').classList.add('hidden');
            document.getElementById('game-actions').classList.remove('hidden');
        }
        
        async function openSaveLoad() {
            if (!gameId) {
                showMessage('Create a character first', 'error');
                return;
            }
            try {
                const response = await fetch('/api/saves');
                const data = await response.json();
                
                const listDiv = document.getElementById('saves-list');
                if (data.saves && data.saves.length > 0) {
                    listDiv.innerHTML = data.saves.map(save => {
                        const date = new Date(save.saved_at * 1000);
                        return `
                            <div class="quest-item">
                                <div class="quest-name">${save.character_name} (Level ${save.level})</div>
                                <div class="quest-description">Saved: ${date.toLocaleString()}</div>
                                <button onclick="loadGame('${save.game_id}')" style="margin-top: 10px;">Load</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    listDiv.innerHTML = '<p style="color: #94a3b8;">No saved games</p>';
                }
                
                document.getElementById('save-load-panel').classList.remove('hidden');
                document.getElementById('game-actions').classList.add('hidden');
            } catch (error) {
                showMessage('Error loading saves: ' + error.message, 'error');
            }
        }
        
        function closeSaveLoad() {
            document.getElementById('save-load-panel').classList.add('hidden');
            document.getElementById('game-actions').classList.remove('hidden');
        }
        
        async function saveGame() {
            if (!gameId) return;
            try {
                const response = await fetch(`/api/game/${gameId}/save`, {method: 'POST'});
                const data = await response.json();
                showMessage(data.message, 'success');
            } catch (error) {
                showMessage('Error saving: ' + error.message, 'error');
            }
        }
        
        async function loadGame(loadGameId) {
            if (!confirm('Load this game? Current progress will be lost.')) return;
            try {
                const response = await fetch(`/api/game/${loadGameId}/load`, {method: 'POST'});
                const data = await response.json();
                gameId = loadGameId;
                gameState = data.game_state;
                showMessage('Game loaded!', 'success');
                updateCharacterSheet();
                closeSaveLoad();
            } catch (error) {
                showMessage('Error loading: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
