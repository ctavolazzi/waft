[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-pokey-stick"
version = "0.1.0"
description = "Pokey Stick for Testing - Probe services, endpoints, and files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "WAFT Team", email = "waft@example.com"}
]
keywords = ["testing", "probe", "monitoring", "health-check", "api-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ctavolazzi/probe-pokey-stick"
Repository = "https://github.com/ctavolazzi/probe-pokey-stick"
Issues = "https://github.com/ctavolazzi/probe-pokey-stick/issues"
Documentation = "https://github.com/ctavolazzi/probe-pokey-stick#readme"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["probe"]

[tool.setuptools.package-data]
probe = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
